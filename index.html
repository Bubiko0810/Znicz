<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#29243a">
    <title>W pamięci</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #222224, #181519 55%, #0e0c0c);
            color: #fffaf3;
            text-align: center;
        }

        main {
            max-width: 600px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.25rem, 8vw, 4rem);
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        p {
            margin: 0;
            color: #eee3e1;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main>
        <h1>W pamięci</h1>
        <p>Ci, których kochamy, pozostają z nami we wspomnieniach.</p>
    </main>
</body>
</html>
