<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>W pamięci</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #222224, #181519 55%, #0e0c0c);
            color: #fffaf3;
            text-align: center;
        }

        main {
            max-width: 600px;
        }

        .candle-gif {
            display: block;
            width: min(80vw, 360px);
            max-height: 55vh;
            height: auto;
            margin: 0 auto 24px;
            object-fit: contain;
            border-radius: 12px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.25rem, 8vw, 4rem);
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        p {
            margin: 0;
            color: #eee3e1;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main>
        <img
            class="candle-gif"
            src="https://media1.tenor.com/m/sP6LfTzBBqcAAAAC/candle-flame-candle.gif"
            alt="Znicz"
            width="360">
        <h1>W pamięci</h1>
        <p>Ci, których kochamy, pozostają z nami we wspomnieniach.</p>
    </main>
</body>
</html>
